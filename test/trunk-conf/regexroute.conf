; Route calls to "petite" straight at the receiver container (compose DNS),
; offering only image/t38 media so the INVITE itself is a T.38 offer -
; the params after ';' are applied to the outgoing call.execute and
; override the audio offer fax/transmit would otherwise make.
; (A real provider would instead route to the registered contact and
; re-INVITE to T.38 after tone detection.)

[default]
^petite$=sip/sip:petite@yate:5060;media=false;media_image=true;formats_image=t38;transport_image=udptl
