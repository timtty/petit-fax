; Route every inbound call to the fax receiver.
; faxchan picks the mode automatically: if the offer (or a later re-INVITE)
; carries image/t38 media it terminates T.38 via spandsp, otherwise it
; receives as an audio (G.711) fax.
;
; NOTE: faxchan does not create directories - /var/spool/fax must exist
; (the Docker image creates it, and docker-compose mounts ./spool there).
; ${billid} is unique per call, so files never collide.

[default]
.*=fax/receive//var/spool/fax/rx-${billid}-${caller}.tiff;faxecm=true
